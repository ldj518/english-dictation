name: Deploy to Cloudflare Pages

# 推送到 main 就自动构建 + 部署
on:
  push:
    branches: [main]
  workflow_dispatch:      # 也支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 用 22：Node 20 已被 GitHub 标记弃用（会被强制跑在 Node 24 上），
          # 而 cloudflare/wrangler-action@v3 在强制迁移后 npx 会失败。
          # 直接用 Node 22 可完全避开该问题。
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci 会安装 devDependencies 里的 wrangler（版本由 package-lock 锁定）
        run: npm ci

      - name: Build
        # 音频托管在 R2，构建时注入地址（在仓库 Secrets 里配置 VITE_AUDIO_BASE）
        env:
          VITE_AUDIO_BASE: ${{ secrets.VITE_AUDIO_BASE }}
        run: npm run build

      - name: Verify Cloudflare credentials
        # 提前校验密钥：token 失效时给出明确报错，而不是在部署步骤里含糊失败。
        # 只打印长度与前 8 位，绝不泄露完整 token。
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "token length = ${#CF_TOKEN}"
          echo "token prefix = ${CF_TOKEN:0:8}..."
          echo "account id   = $CF_ACCOUNT"
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Secrets 里没有 CLOUDFLARE_API_TOKEN，请在仓库 Settings → Secrets 添加"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Secrets 里没有 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets 添加"
            exit 1
          fi
          code=$(curl -s -o /tmp/cf.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "pages/projects HTTP = $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare 拒绝了该 Token（HTTP $code）。"
            echo "::error::最常见原因：Token 已过期/被撤销，或权限未包含「Cloudflare Pages: Edit」。"
            echo "::error::请到 https://dash.cloudflare.com/profile/api-tokens 重新创建并更新仓库 Secret。"
            exit 1
          fi
          echo "✅ Cloudflare 凭据校验通过"

      - name: Publish to Cloudflare Pages
        # 直接调用本地依赖里的 wrangler，不再用 cloudflare/wrangler-action@v3。
        # 原因：该 action 会在 CI 里用 npx 临时拉取 wrangler，在 Node 20→24 强制迁移后
        # 报 "npx failed with exit code 1"；直接用 npm ci 装好的本地 wrangler 更稳、更可控。
        # functions/ 目录会被自动识别为 Pages Functions（后端 API），
        # D1 / R2 绑定已在 Pages 项目里配置好，wrangler 会自动使用。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx --no-install wrangler --version
          npx --no-install wrangler pages deploy dist \
            --project-name=english-dictation --branch=main
